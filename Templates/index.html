<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Emotion Analyzer</title>

    <!-- ✅ CSS File -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- ✅ Bootstrap CDN for layout -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

<main class="app-container">

    <!-- ✅ Left Panel -->
    <div class="control-panel">

        <!-- Upload Section -->
        <h5 class="section-title">Upload Image</h5>
        <form id="uploadForm" enctype="multipart/form-data">
            <input class="form-control form-control-lg" type="file" name="image" accept="image/*" required>
            <button type="submit">Analyze Upload</button>
        </form>

        <hr class="divider">

        <!-- Camera Section -->
        <h5 class="section-title">Capture from Camera</h5>

        <!-- Turn Camera On button now at top -->
        <button id="toggleCam">Turn Camera On</button>

        <!-- Camera Video -->
        <video id="camera" autoplay playsinline></video>

        <!-- Capture Button -->
        <button id="snap" disabled>Capture & Analyze</button>

    </div>

    <!-- ✅ Right Panel (Results) -->
    <div class="result-panel">
        <h5 class="section-title">Results</h5>

        <p id="status">No analysis yet.</p>

        <div id="emotionBadge"></div>

        <div id="emotionBreakdown"></div>

        <div id="previewWrap">
            <img id="previewImage" src="" alt="preview" style="display:none;">
        </div>
    </div>

</main>

<footer class="mt-4 text-muted small text-center">
    Built with Flask • DeepFace • OpenCV
</footer>


<!-- Main JS -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
